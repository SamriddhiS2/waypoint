<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waypoint Trip Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: timetable-style planner. Sticky header with tabs; Plan = day rail | day timeline | wishlist tray. */
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --sunk:#EBEEEA; --ink:#17201C; --muted:#5F6B65; --line:#DFE4DF;
  --accent:#2D6A55; --accent-ink:#FFFFFF;
  --c-place:#2D6A55; --c-transport:#B4741A; --c-food:#B0505C; --c-stay:#4A59A3; --c-free:#7A8580;
  --c-drive:#A0522D; --c-stop:#6F7F1E; --c-visit:#2F7F95; --c-work:#5B5F86; --c-ev:#C8102E;
  --m-flight:#4A59A3; --m-train:#2D6A55; --m-bus:#B4741A; --m-car:#B0505C; --m-rideshare:#8A6A2F; --m-ferry:#2F7F95;
  --ok:#2F7D4E; --warn:#B4741A; --bad:#B23A3A;
  --f-display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#181F1C; --sunk:#0D1210; --ink:#E6ECE8; --muted:#93A099; --line:#28312D;
  --accent:#6DB79C; --accent-ink:#0D1A15;
  --c-place:#6DB79C; --c-transport:#E0A34A; --c-food:#E07F8B; --c-stay:#8C99E3; --c-free:#9AA59F;
  --c-drive:#E3906A; --c-stop:#B6C65A; --c-visit:#5DB6CC; --c-work:#A9ADD8; --c-ev:#FF6B7A;
  --m-flight:#8C99E3; --m-train:#6DB79C; --m-bus:#E0A34A; --m-car:#E07F8B; --m-rideshare:#D3A162; --m-ferry:#5DB6CC;
  --ok:#64C08A; --warn:#E0A34A; --bad:#EE7B7B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#181F1C; --sunk:#0D1210; --ink:#E6ECE8; --muted:#93A099; --line:#28312D;
  --accent:#6DB79C; --accent-ink:#0D1A15;
  --c-place:#6DB79C; --c-transport:#E0A34A; --c-food:#E07F8B; --c-stay:#8C99E3; --c-free:#9AA59F;
  --c-drive:#E3906A; --c-stop:#B6C65A; --c-visit:#5DB6CC; --c-work:#A9ADD8; --c-ev:#FF6B7A;
  --m-flight:#8C99E3; --m-train:#6DB79C; --m-bus:#E0A34A; --m-car:#E07F8B; --m-rideshare:#D3A162; --m-ferry:#5DB6CC;
  --ok:#64C08A; --warn:#E0A34A; --bad:#EE7B7B; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px 16px;padding-block:14px 10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.brand svg{width:18px;height:18px}
.trip{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.trip h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.trip .sub{color:var(--muted);font-size:13px;display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center}
.count{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);white-space:nowrap}
.hbtns{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.lg{padding:11px 18px;font-size:15px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px 11px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .badge{font-family:var(--f-mono);font-size:10px;background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn);border-radius:99px;padding:0 6px;line-height:16px}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.12);padding:6px;min-width:210px;z-index:20;display:flex;flex-direction:column}
.menu-pop button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px}
.menu-pop button:hover{background:var(--sunk)}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}

main{padding-block:20px 60px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;letter-spacing:-.01em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tip{font-size:12px;color:var(--muted);line-height:1.5}
.hint{font-size:12px;color:var(--muted);font-weight:400}

/* Welcome */
.welcome{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:40px;align-items:start;padding-block:24px}
.welcome h2.big{font-size:clamp(28px,4vw,40px);line-height:1.08;text-wrap:balance;margin-bottom:12px}
.welcome .lede{color:var(--muted);font-size:15px;max-width:46ch;margin:0 0 24px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;max-width:46ch}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.steps b{display:block;font-weight:600}
.steps span.n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.steps p{margin:2px 0 0;color:var(--muted);font-size:13px}
.welcome form{padding:22px;display:flex;flex-direction:column;gap:14px}

/* Plan layout */
.plan{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;gap:20px;align-items:start}
.rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(var(--hdr,120px) + 12px);max-height:calc(100vh - var(--hdr,120px) - 24px);overflow-y:auto;min-width:0;scrollbar-width:thin}
.dayb{border:1px solid transparent;background:none;border-radius:9px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:5px;width:100%}
.dayb:hover{background:var(--surface)}
.dayb[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.dayb .d1{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.dayb .d2{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayb .d2.none{color:var(--muted);font-weight:400}
.dayb.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.ubar{display:flex;height:4px;border-radius:4px;background:var(--sunk);overflow:hidden;gap:1px}
.ubar i{display:block;height:100%}

.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.dayhead .tt{flex:1;min-width:220px}
.daynav{display:flex;align-items:center;gap:6px}
.daytitle{font-family:var(--f-display);font-size:24px;font-weight:600;border:0;background:none;padding:2px 0;width:100%;letter-spacing:-.01em;border-bottom:1px dashed var(--line)}
.daytitle::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.daytitle:focus{outline:none;border-bottom-color:var(--accent)}
.window{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.window input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:12px}
.stats{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 0 8px}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.stats .warn b{color:var(--warn)}
.bigbar{height:8px;margin-bottom:18px}

.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:76px 18px minmax(0,1fr) auto;gap:0 10px;align-items:start;padding:10px 10px 10px 4px;border-radius:9px;cursor:pointer;position:relative}
.entry:hover{background:var(--surface)}
.entry.dragging{opacity:.4}
.entry.dropbefore{box-shadow:inset 0 2px 0 var(--accent)}
.entry .tm{font-family:var(--f-mono);font-size:12px;line-height:1.4;text-align:right;padding-top:2px;white-space:nowrap}
.entry .tm span{display:block;color:var(--muted);font-size:11px}
.entry .rail-dot{position:relative;align-self:stretch;display:flex;justify-content:center}
.entry .rail-dot::before{content:"";position:absolute;top:-10px;bottom:-10px;width:2px;background:var(--line)}
.tl > .entry:first-child .rail-dot::before{top:8px}
.tl > .entry:last-child .rail-dot::before{bottom:calc(100% - 8px)}
.entry .rail-dot i{position:relative;width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--surface);border:3px solid var(--tc)}
.entry.leg .rail-dot i{border-radius:3px;background:var(--tc)}
.entry.autotr .ttl{font-weight:500}
.entry.autotr .rail-dot i{width:10px;height:10px;opacity:.8}
.entry .ttl{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry .meta{color:var(--muted);font-size:12px;display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:3px}
.entry .meta a{text-decoration:none;border-bottom:1px solid var(--line)}
.entry .meta a:hover{color:var(--ink)}
.entry .notes{font-size:12px;color:var(--muted);margin-top:4px;max-width:60ch}
.entry .grip{color:var(--muted);opacity:0;padding:2px 4px;cursor:grab;font-size:14px;line-height:1}
.entry:hover .grip{opacity:.7}
.chip{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:color-mix(in srgb,var(--tc) 14%,var(--surface));color:var(--tc);white-space:nowrap}
.flag{font-size:11px;font-weight:500;padding:1px 6px;border-radius:4px;white-space:nowrap}
.flag.todo{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.flag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.flag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.flag.fixed{color:var(--muted);background:var(--sunk)}
.gap{display:grid;grid-template-columns:76px 18px 1fr;gap:0 10px;font-size:12px;color:var(--muted);padding:2px 10px 2px 4px}
.gap .rail-dot{display:flex;justify-content:center;position:relative}
.gap .rail-dot::before{content:"";position:absolute;top:-2px;bottom:-2px;width:2px;background:repeating-linear-gradient(var(--line) 0 3px,transparent 3px 6px)}
.gap span{padding:4px 0;font-style:italic}
.t-place{--tc:var(--c-place)} .t-transport{--tc:var(--c-transport)} .t-food{--tc:var(--c-food)} .t-stay{--tc:var(--c-stay)} .t-free{--tc:var(--c-free)}
.t-drive{--tc:var(--c-drive)} .t-stop{--tc:var(--c-stop)} .t-visit{--tc:var(--c-visit)} .t-work{--tc:var(--c-work)}
.m-flight{--tc:var(--m-flight)} .m-train{--tc:var(--m-train)} .m-bus{--tc:var(--m-bus)} .m-car{--tc:var(--m-car)} .m-rideshare{--tc:var(--m-rideshare)} .m-ferry{--tc:var(--m-ferry)}

.adds{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btnrow .btn i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.dayempty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);margin-top:16px}
.dayempty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.dayempty .btnrow{justify-content:center;margin-top:14px}

.tray{position:sticky;top:calc(var(--hdr,120px) + 12px);display:flex;flex-direction:column;gap:10px;min-width:0}
.plan > section{min-width:0}
.tray .panel{padding:14px}
.tray-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.idea{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;border:1px solid var(--line);margin-bottom:6px;background:var(--surface);cursor:grab}
.idea:hover{border-color:color-mix(in srgb,var(--ink) 20%,var(--line))}
.idea .ib{flex:1;min-width:0}
.idea .it{font-weight:500;font-size:13px}
.iconbtn{border:0;background:none;border-radius:6px;min-width:26px;height:26px;padding:0 6px;display:inline-grid;place-items:center;color:var(--muted);flex:none;font-size:13px;white-space:nowrap}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn.add{color:var(--accent);font-weight:600;font-size:12px}
.inline-add{display:flex;gap:6px;margin-top:8px}
.inline-add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--tc)}

/* Schedule */
.sched-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sched-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sched{display:grid;min-width:max-content}
.sched .colh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:10px;font-size:12px;z-index:2;cursor:pointer}
.sched .colh b{display:block;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched .colh span{color:var(--muted)}
.hours{position:relative;border-right:1px solid var(--line)}
.hours div{position:absolute;right:6px;font-family:var(--f-mono);font-size:10px;color:var(--muted);transform:translateY(-50%);white-space:nowrap}
.col{position:relative;border-right:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.col:last-child{border-right:0}
.col .off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--ink) 4%,transparent) 6px 7px)}
.blk{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 7px;font-size:11px;overflow:hidden;background:color-mix(in srgb,var(--tc) 14%,var(--surface));border-left:3px solid var(--tc);cursor:pointer;line-height:1.3}
.blk:hover{background:color-mix(in srgb,var(--tc) 22%,var(--surface));z-index:3}
.blk b{display:block;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{font-family:var(--f-mono);color:var(--muted);font-size:10px}
.blk.overlap{left:16px;outline:1px solid var(--bad)}

/* Travel */
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.sect{display:flex;flex-direction:column;gap:12px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:8px 0;padding:18px}
.stop{font-family:var(--f-display);font-weight:600;font-size:15px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.hop{display:flex;flex-direction:column;align-items:center;padding:0 6px;min-width:84px}
.hop .ln{height:2px;width:100%;background:var(--tc)}
.hop.dash{--tc:var(--c-free)}
.hop.dash .ln{background:repeating-linear-gradient(90deg,var(--tc) 0 5px,transparent 5px 9px)}
.hop small{font-family:var(--f-mono);font-size:10px;color:var(--tc);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.hop em{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:3px}
.board{width:100%;border-collapse:collapse;font-size:13px}
.board th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.board td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.board tr:last-child td{border-bottom:0}
.board tbody tr{cursor:pointer}
.board tbody tr:hover td{background:var(--bg)}
.board .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.kpi{background:var(--surface);padding:14px 16px}
.kpi b{display:block;font-family:var(--f-mono);font-weight:500;font-size:20px;margin-top:4px;white-space:nowrap}
.mix{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:10px 0 8px}
.mixleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.mixleg span{display:inline-flex;gap:6px;align-items:center}
.mixleg i{width:8px;height:8px;border-radius:2px;background:var(--tc)}
.modepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:18px}
.modepick .btn{justify-content:flex-start;padding:12px}
.modepick .btn i{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.cmp{padding:16px}
.cmp label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.cmp .row{display:flex;gap:10px;align-items:end;margin-bottom:12px}
.cmp input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;width:120px;font-family:var(--f-mono)}
.cmpt{width:100%;border-collapse:collapse;font-size:13px}
.cmpt td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.cmpt td.num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.cmpt .bar{height:6px;border-radius:3px;background:var(--tc);opacity:.75;margin-top:6px}

/* Budget */
.budget-top{padding:20px;display:flex;flex-direction:column;gap:12px}
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

const getDur = fd => (+fd.get('dh') || 0) * 60 + (+fd.get('dm') || 0);
const timeHint = 'Leave blank to start right after the previous item';

/* ---------- item forms, one per type ---------- */
const AC = 'data-ac autocomplete="off"';
const sel = (name, opts, val, label) => `<label class="field">${label}<select name="${name}">${Object.entries(opts).map(([k, l]) => `<option value="${k}" ${String(k) === String(val) ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
function itemForm(dayKey, idx, type) {
  const isNew = idx == null, ds = days();
  const it = isNew ? {type, title:'', time:'', dur:TYPES[type].dur, loc:'', cost:0, book:'', ref:'', notes:'', meal:'lunch', mode:'rideshare', stayKind:'in', kind:'', nights:1, from:'', to:'', miles:'', extra:0, breakEvery:120, breakLen:15, contact:'', by:'', wifi:true, auto:true} : {...S.days[dayKey].items[idx]};
  const t = it.type, dayLabel = `Day ${ds.indexOf(dayKey) + 1}`;
  if (isNew && t === 'food') it.meal = schedule(dayKey).entries.some(x => x.type === 'food') ? 'dinner' : 'breakfast';
  if (t === 'stay') { it.kind ||= 'hotel'; if (isNew) it.time = STAYS[it.kind].tin; }
  if (isNew && t === 'stop') it.kind = 'rest';
  if (isNew && t === 'work') it.kind = 'focus';
  if (isNew && t === 'free') it.kind = 'free';
  const prevPl = isNew ? (lastPlaceOf(dayKey) || startPlace(dayKey)) : (withPrev(dayKey, schedule(dayKey)).entries.find(x => x.kind === 'item' && x.idx === idx)?.prev || '');
  const bookOn = it.book === 'todo' || it.book === 'booked';
  const people = plural(S.trip.travelers || 1, 'person', 'people');
  let body = '', heading = '';
  if (t === 'drive') {
    heading = isNew ? `Add a drive to ${dayLabel}` : 'Edit drive';
    body = `<div class="frow">${F('from', 'From', it.from, `${AC} placeholder="${esc(prevPl ? 'Blank = ' + prevPl : 'Street address')}"`)}${F('to', 'Driving to', it.to, `${AC} id="f-req" placeholder="Street address" autofocus`)}</div>
      <label class="toggle"><input type="checkbox" name="auto" id="autoChk" ${it.auto ? 'checked' : ''}>Calculate time and miles from the addresses</label>
      <div class="est"><button type="button" class="btn sm" id="estBtn">Calculate now</button><span class="hint" id="estOut">Fills in driving time and distance for the two places.</span></div>
      <div class="frow">${T('time', 'Leave at', it.time, timeHint)}${durField(it.dur, 'Driving time', [60, 120, 180, 240, 360, 480])}</div>
      <div class="frow"><label class="field">Distance (miles)<input type="number" min="0" name="miles" value="${it.miles || ''}" placeholder="Optional"></label>${sel('breakEvery', BREAKS, +it.breakEvery || 0, 'Breaks')}<label class="field">Break length (min)<input type="number" min="5" max="60" step="5" name="breakLen" value="${it.breakLen || 15}"></label></div>
      <div class="calc" id="driveCalc"></div>
      ${M('extra', 'Tolls and parking', it.extra)}
      ${N('Route notes, where to fill up', it.notes)}`;
  } else if (t === 'stop') {
    heading = isNew ? `Add a road stop to ${dayLabel}` : 'Edit road stop';
    body = `<div class="field">What kind of stop?${seg('kind', STOPS, it.kind)}</div>
      <div class="frow">${F('title', 'Name', it.title, 'placeholder="Optional, e.g. Weed Supercharger"')}${F('loc', 'Where', it.loc, `${AC} placeholder="Street address"`)}</div>
      <div class="frow">${T('time', 'Time', it.time, timeHint)}${durField(it.dur, 'How long', [10, 15, 20, 30, 45])}</div>
      ${M('cost', 'Expected spend', it.cost)}
      ${N('Anything to remember', it.notes)}`;
  } else if (t === 'visit') {
    heading = isNew ? `Visit someone on ${dayLabel}` : 'Edit visit';
    body = `${F('title', 'Who are you visiting?', it.title, 'id="f-req" placeholder="e.g. Anita and Raj" autofocus')}
      <div class="frow">${F('loc', 'Their street address', it.loc, `${AC} placeholder="e.g. 1420 Elm St, Davis, CA"`)}${F('contact', 'Their phone', it.contact, 'placeholder="To text your ETA"')}</div>
      <div class="frow">${T('time', 'Arrive at', it.time, timeHint)}${T('by', 'Need to be there by', it.by, 'Optional. Flags the visit if you would arrive later')}</div>
      <div class="frow">${durField(it.dur, 'How long you will stay', [60, 120, 180, 240])}${statusSel(it.book || 'todo', 'Not confirmed yet', 'Confirmed with them')}</div>
      ${N('Gift to bring, what to talk about, parking', it.notes)}`;
  } else if (t === 'place') {
    heading = isNew ? `Add an activity to ${dayLabel}` : 'Edit activity';
    body = `${F('title', 'What are you doing?', it.title, 'id="f-req" placeholder="e.g. Temple visit, hike to Burney Falls" autofocus')}
      ${F('loc', 'Street address', it.loc, `${AC} placeholder="e.g. 3724 Summit Dr, Mount Shasta, CA"`)}
      <div class="frow">${T('time', 'Start time', it.time, timeHint)}${durField(it.dur)}</div>
      <label class="toggle"><input type="checkbox" name="needs" data-toggle="#bookSec" ${bookOn ? 'checked' : ''}>Needs tickets or a reservation</label>
      <div class="subsec" id="bookSec"><div class="frow">${statusSel(it.book, 'Need to buy', 'Have tickets')}${M('cost', `Price for ${people}`, it.cost)}</div>${F('ref', 'Confirmation number', it.ref, 'placeholder="Optional"')}</div>
      ${N('Opening hours, dress code, tips', it.notes)}`;
  } else if (t === 'food') {
    heading = isNew ? `Add a meal to ${dayLabel}` : 'Edit meal';
    body = `<div class="field">Which meal?${seg('meal', MEALS, it.meal)}</div>
      ${F('title', 'Restaurant', it.title, 'placeholder="Leave blank if you haven\'t picked one yet"')}
      ${F('loc', 'Street address', it.loc, `${AC} placeholder="Optional. Leave blank if it's where you already are"`)}
      <div class="frow">${T('time', 'Time', it.time, timeHint)}${durField(it.dur, 'How long', [30, 45, 60, 90, 120])}</div>
      <label class="toggle"><input type="checkbox" name="needs" data-toggle="#bookSec" ${bookOn ? 'checked' : ''}>Needs a reservation</label>
      <div class="subsec" id="bookSec"><div class="frow">${statusSel(it.book, 'Need to reserve', 'Reserved')}${F('ref', 'Name or confirmation', it.ref, 'placeholder="Optional"')}</div></div>
      <label class="toggle"><input type="checkbox" name="hasCost" data-toggle="#costSec" ${+it.cost ? 'checked' : ''}>Count it in my budget</label>
      <div class="subsec" id="costSec">${M('cost', `Expected total for ${people}, with tip`, it.cost)}</div>
      ${N('Dishes to try, dress code', it.notes)}`;
  } else if (t === 'stay') {
    const k = STAYS[it.kind];
    heading = isNew ? `Where are you sleeping on ${dayLabel}?` : 'Edit overnight';
    body = `<div class="field">Type of place${seg('kind', Object.fromEntries(Object.entries(STAYS).map(([x, v]) => [x, v.label])), it.kind)}</div>
      <div class="seg" id="inoutSeg"></div>
      ${F('title', `<span id="nameLbl">${k.name}</span>`, it.title, `id="f-req" placeholder="${esc(k.ph)}" autofocus`)}
      <div class="frow">${F('loc', 'Street address', it.loc, `${AC} placeholder="Used to work out travel there"`)}<label class="field friendOnly">Host's phone<input name="contact" value="${esc(it.contact)}" placeholder="To text your ETA"></label></div>
      <div class="frow">${T('time', 'Time', it.time, '<span id="timeHint"></span>')}<label class="field inOnly">Nights<input type="number" min="1" max="60" name="nights" value="${it.nights || 1}"></label></div>
      <div class="inOnly paidOnly frow">${statusSel(it.book, 'Not booked yet', 'Booked')}${M('cost', 'Total with taxes and fees', it.cost)}</div>
      <div class="inOnly paidOnly">${F('ref', 'Confirmation number', it.ref, 'placeholder="Optional"')}</div>
      <div class="inOnly friendOnly"><label class="field">Status<select name="hostbook"><option value="todo" ${it.book !== 'booked' ? 'selected' : ''}>Ask host</option><option value="booked" ${it.book === 'booked' ? 'selected' : ''}>Host confirmed</option></select></label></div>
      ${N('Door code, parking, Wi-Fi, what to bring', it.notes)}`;
  } else if (t === 'work') {
    heading = isNew ? `Block off work on ${dayLabel}` : 'Edit work block';
    body = `<div class="field">Kind of work${seg('kind', WORKS, it.kind)}</div>
      <div class="frow">${F('title', 'What', it.title, 'placeholder="Optional, e.g. Weekly team call"')}${F('loc', 'Where', it.loc, 'placeholder="e.g. At Priya\'s, a café"')}</div>
      <div class="frow">${T('time', 'Start time', it.time, 'Set a time for calls and meetings')}${durField(it.dur, 'How long', [30, 60, 120, 180, 240, 480])}</div>
      <label class="toggle"><input type="checkbox" name="wifi" ${it.wifi ? 'checked' : ''}>Needs Wi-Fi or good signal</label>
      ${isNew && ds.length > 1 ? `<label class="toggle"><input type="checkbox" name="repeat">Repeat on every other weekday of the trip<small>Needs a start time</small></label>` : ''}
      ${N('Meeting link, prep', it.notes)}`;
  } else if (t === 'transport') {
    heading = isNew ? `Get around on ${dayLabel}` : 'Edit getting around';
    body = `<div class="field">How?${seg('mode', LOCAL, it.mode || 'rideshare')}</div>
      <div class="frow">${F('from', 'From', it.from, `${AC} placeholder="Blank = your last stop"`)}${F('to', 'To', it.to, `${AC} id="f-req" placeholder="e.g. Union Station" autofocus`)}</div>
      <div class="frow">${T('time', 'Leave at', it.time, timeHint)}${durField(it.dur, 'Travel time', [10, 15, 20, 30, 45, 60])}</div>
      <div id="fareSec">${M('cost', 'Estimated fare', it.cost)}</div>
      ${N('Line, stop or parking details', it.notes)}`;
  } else {
    heading = isNew ? `Add free time to ${dayLabel}` : 'Edit free time';
    body = `<div class="field">Kind${seg('kind', FREES, it.kind || 'free')}</div>
      ${F('title', 'Label', it.title, 'placeholder="e.g. Wander downtown, nap before the drive" autofocus')}
      <div class="frow">${T('time', 'Start time', it.time, timeHint)}${durField(it.dur, 'How long', [30, 60, 120, 180, 480])}</div>
      ${N('Ideas for this time', it.notes)}`;
  }
  const moveSel = `<label class="field">Day<select name="day">${ds.map((k, i) => `<option value="${k}" ${k === dayKey ? 'selected' : ''}>Day ${i + 1} · ${fdate(k)}</option>`).join('')}</select></label>`;
  modal(`${mhead(heading, 't-' + t)}${body}${moveSel}
    <div class="mf">${!isNew ? `<button type="button" class="btn danger" id="delBtn">Delete</button>` : ''}
      <div class="r"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">${isNew ? 'Add' : 'Save'}</button></div></div>`,
  (fd, f) => {
    const req = f.querySelector('#f-req');
    if (req && !req.value.trim()) { req.classList.add('bad'); req.focus(); return false; }
    const g = k => (fd.get(k) || '').toString().trim();
    const o = {id: it.id || uid(), type: t, title: g('title'), time: fd.get('time') || '', dur: getDur(fd) || TYPES[t].dur, loc: g('loc'), notes: g('notes'), cost: 0, book: '', ref: ''};
    if (t === 'place' && fd.get('needs')) { o.book = fd.get('book'); o.cost = +fd.get('cost') || 0; o.ref = g('ref'); }
    if (t === 'food') { o.meal = fd.get('meal'); if (fd.get('needs')) { o.book = fd.get('book'); o.ref = g('ref'); } if (fd.get('hasCost')) o.cost = +fd.get('cost') || 0; }
    if (t === 'stay') { o.kind = fd.get('kind'); o.stayKind = fd.get('stayKind'); o.dur = 30; o.contact = o.kind === 'friend' ? g('contact') : '';
      if (o.stayKind === 'in') { o.nights = +fd.get('nights') || 1; if (STAYS[o.kind].paid) { o.book = fd.get('book'); o.cost = +fd.get('cost') || 0; o.ref = g('ref'); } else if (o.kind === 'friend') o.book = fd.get('hostbook'); } }
    if (t === 'transport') { o.mode = fd.get('mode'); o.from = g('from'); o.to = g('to'); if (!['walk', 'bike'].includes(o.mode)) o.cost = +fd.get('cost') || 0; }
    if (t === 'drive') { o.auto = !!fd.get('auto'); o.from = g('from'); o.to = g('to'); o.loc = ''; o.miles = +fd.get('miles') || ''; o.extra = +fd.get('extra') || 0; o.breakEvery = +fd.get('breakEvery') || 0; o.breakLen = +fd.get('breakLen') || 15; }
    if (t === 'stop') { o.kind = fd.get('kind'); o.cost = +fd.get('cost') || 0; }
    if (t === 'visit') { o.contact = g('contact'); o.by = fd.get('by') || ''; o.book = fd.get('book'); }
    if (t === 'work') { o.kind = fd.get('kind'); o.wifi = !!fd.get('wifi'); }
    if (t === 'free') o.kind = fd.get('kind');
    const target = fd.get('day') || dayKey;
    if (isNew) {
      S.days[target].items.push(o);
      if (t === 'work' && fd.get('repeat') && o.time) ds.forEach(k => { const wd = new Date(k + 'T00:00:00Z').getUTCDay(); if (k !== target && wd > 0 && wd < 6) S.days[k].items.push({...o, id: uid()}); });
      if (target !== dayKey) ui.day = target;
    }
    else if (target !== dayKey) { S.days[dayKey].items.splice(idx, 1); S.days[target].items.push(o); }
    else S.days[dayKey].items[idx] = o;
    commit(); toast(isNew ? (t === 'work' && fd.get('repeat') && o.time ? 'Added to every weekday' : 'Added') : 'Saved');
  },
  (f, close) => {
    f.querySelector('#delBtn')?.addEventListener('click', () => { S.days[dayKey].items.splice(idx, 1); close(); commit(); toast('Deleted'); });
    if (t === 'stay') {
      let io = it.stayKind || 'in';
      const sync = (kindChanged) => {
        const kk = f.querySelector('[name=kind]:checked').value, c = STAYS[kk];
        if (kindChanged) f.time.value = io === 'out' ? c.tout : c.tin;
        f.querySelector('#inoutSeg').innerHTML = ['in', 'out'].map(v => `<label><input type="radio" name="stayKind" value="${v}" ${v === io ? 'checked' : ''}><span>${v === 'in' ? c.in : c.out}</span></label>`).join('');
        f.querySelectorAll('[name=stayKind]').forEach(r => r.addEventListener('change', () => { io = r.value; f.time.value = io === 'out' ? c.tout : c.tin; sync(); }));
        f.querySelector('#nameLbl').textContent = c.name; f.querySelector('[name=title]').placeholder = c.ph;
        f.querySelector('#timeHint').textContent = io === 'out' ? `Usually around ${t12(toMin(c.tout))}` : (kk === 'friend' ? 'When you expect to get there' : `Usually from ${t12(toMin(c.tin))}`);
        f.querySelectorAll('.inOnly').forEach(e => e.hidden = io === 'out');
        f.querySelectorAll('.paidOnly').forEach(e => e.hidden = io === 'out' || !c.paid);
        f.querySelectorAll('.friendOnly').forEach(e => e.hidden = kk !== 'friend' || (e.classList.contains('inOnly') && io === 'out'));
      };
      f.querySelectorAll('[name=kind]').forEach(r => r.addEventListener('change', () => sync(true)));
      sync();
    }
    if (t === 'transport') {
      const sync = () => { f.querySelector('#fareSec').hidden = ['walk', 'bike'].includes(f.querySelector('[name=mode]:checked').value); };
      f.querySelectorAll('[name=mode]').forEach(r => r.addEventListener('change', sync)); sync();
    }
    if (t === 'drive') {
      const calc = f.querySelector('#driveCalc');
      const upd = () => {
        const d = getDur(new FormData(f)), every = +f.breakEvery.value, bl = +f.breakLen.value || 15, nb = every ? Math.max(0, Math.ceil(d / every) - 1) : 0, mi = +f.miles.value;
        calc.innerHTML = `On the road for <b>${fdur(d + nb * bl)}</b>${nb ? ` (${fdur(d)} driving, ${plural(nb, 'break')} of ${bl} min)` : ''}.${mi ? ` Uses about <b>${Math.round(mi / milesPerPct(VEH()))}%</b> of your battery. Supercharger stops are added on the timeline when needed.` : ''}${d > DRIVE_WARN ? ' <span style="color:var(--warn)">That is a very long day behind the wheel.</span>' : ''}`;
      };
      f.addEventListener('input', upd); f.addEventListener('change', upd); f.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => setTimeout(upd)));
      upd();
      const autoChk = f.querySelector('#autoChk');
      const syncAuto = () => { [f.dh, f.dm, f.miles].forEach(el => { el.readOnly = autoChk.checked; el.style.opacity = autoChk.checked ? .6 : 1; }); f.querySelectorAll('[data-q]').forEach(b => b.disabled = autoChk.checked); if (autoChk.checked) f.querySelector('#estBtn').click(); };
      autoChk.addEventListener('change', syncAuto);
      [f.from, f.to].forEach(el => el.addEventListener('change', () => { if (autoChk.checked) f.querySelector('#estBtn').click(); }));
      setTimeout(syncAuto);
      f.querySelector('#estBtn').addEventListener('click', async () => {
        const out = f.querySelector('#estOut'), from = f.from.value.trim() || prevPl, to = f.to.value.trim();
        if (!from || !to) { out.textContent = 'Enter where you are driving from and to.'; return; }
        out.textContent = 'Looking up the route…';
        const [a, b] = await Promise.all([GEO.coords(from), GEO.coords(to)]);
        if (!a || !b) { out.textContent = `Couldn't place ${!a ? from : to} on the map. Use Find with Claude in that box, or enter the time yourself.`; return; }
        const k = rkey(from, to), r = S.routes[k]?.manual ? S.routes[k] : await GEO.route(a, b);
        if (!S.routes[k]?.manual) S.routes[k] = {mins:r.mins, miles:r.miles, src:r.src, approx:!!r.approx};
        f.dh.value = Math.floor(r.mins / 60); f.dm.value = r.mins % 60; f.miles.value = r.miles;
        out.textContent = r.src; upd();
      });
    }
  });
}

/* ---------- travel leg form, tailored per mode ---------- */
function legForm(id, mode, draft) {
  const isNew = !id, ds = days();
  const last = sortedLegs().slice(-1)[0];
  const base = isNew ? {mode: 'flight', from: last?.to || '', to:'', date: (ui.view === 'plan' && ui.day) || (last ? last.date : ds[0]), dep:'09:00', arr:'11:00', dur:120, cost:'', extra:'', book:'todo', ref:'', carrier:'', number:'', seat:'', rental:false, miles:'', notes:''} : {...S.legs.find(x => x.id === id)};
  if (isNew && last && last.date === base.date) { const s = toMin(last.arr) + 60; if (s < 1380) { base.dep = hhmm(s); base.arr = hhmm(s + 120); } }
  if (!base.dur) base.dur = legDur(base) || 60;
  const l = {...base, ...(draft || {}), ...(mode ? {mode} : {})};
  const m = l.mode, cfg = LEGS[m], travelers = plural(S.trip.travelers || 1, 'traveler');
  const dateSel = `<label class="field">Date<select name="date">${ds.map((k, i) => `<option value="${k}" ${k === l.date ? 'selected' : ''}>Day ${i + 1} · ${fdate(k)}</option>`).join('')}${!ds.includes(l.date) && l.date ? `<option value="${l.date}" selected>${fdate(l.date)}</option>` : ''}</select></label>`;
  let body = `<div class="field">Type${seg('mode', Object.fromEntries(Object.entries(LEGS).map(([k, v]) => [k, `<i></i>${v.label}`])), m)}</div>
    <div class="frow">${F('from', cfg.from, l.from, `${AC} id="f-from" placeholder="${cfg.fromPh}" autofocus`)}${F('to', cfg.to, l.to, `${AC} id="f-to" placeholder="${cfg.toPh}"`)}</div>`;
  if (cfg.fixedTimes) {
    body += `<div class="frow">${F('carrier', cfg.carrier, l.carrier, `placeholder="${cfg.carrierPh}"`)}${cfg.number ? F('number', cfg.number, l.number, `placeholder="${cfg.numberPh}"`) : ''}</div>
      <div class="frow">${dateSel}${T('dep', 'Departs', l.dep)}${T('arr', 'Arrives', l.arr, m === 'flight' ? 'Local time where you land' : '')}</div>
      <div class="frow">${statusSel(l.book, 'Not booked yet', 'Booked')}${M('cost', `Total fare, ${travelers}`, l.cost)}</div>
      <div class="frow">${F('ref', 'Confirmation code', l.ref, 'placeholder="Optional"')}${cfg.seat ? F('seat', cfg.seat, l.seat, `placeholder="${cfg.seatPh}"`) : ''}</div>`;
  } else if (m === 'car') {
    body += `<div class="frow">${dateSel}${T('dep', 'Leave at', l.dep)}</div>
      <div class="frow">${durField(l.dur, 'Driving time', [60, 120, 180, 240, 360])}<label class="field">Distance (miles)<input type="number" min="0" name="miles" value="${l.miles || ''}" placeholder="Optional"></label></div>
      <div class="calc" id="gasCalc"></div>
      ${M('extra', 'Tolls and parking', l.extra)}
      <label class="toggle"><input type="checkbox" name="rental" data-toggle="#rentSec" ${l.rental ? 'checked' : ''}>Rental car</label>
      <div class="subsec" id="rentSec"><div class="frow">${F('carrier', 'Rental company', l.carrier, 'placeholder="e.g. Enterprise, Hertz"')}${F('ref', 'Confirmation code', l.ref, 'placeholder="Optional"')}</div>
        <div class="frow">${statusSel(l.book, 'Not booked yet', 'Booked')}${M('cost', 'Rental total', l.cost)}</div></div>`;
  } else {
    body += `<div class="frow">${dateSel}${T('dep', 'Pickup time', l.dep)}</div>
      <div class="frow">${durField(l.dur, 'Ride time', [15, 30, 45, 60])}${M('cost', 'Estimated fare', l.cost)}</div>`;
  }
  body += N(m === 'flight' ? 'Terminal, bags, layovers' : m === 'car' ? 'Stops along the way' : 'Anything to remember', l.notes);
  modal(`${mhead(isNew ? 'Add travel' : 'Edit travel', 'm-' + m)}${body}
    <div class="mf">${!isNew ? '<button type="button" class="btn danger" id="delBtn">Delete</button>' : ''}
      <div class="r"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">${isNew ? 'Add' : 'Save'}</button></div></div>`,
  (fd, f) => {
    const g = k => (fd.get(k) || '').toString().trim();
    const from = g('from'), to = g('to');
    if (!from || !to) { const el = from ? f.querySelector('#f-to') : f.querySelector('#f-from'); el.classList.add('bad'); el.focus(); return false; }
    const o = {id: l.id || uid(), mode: m, from, to, date: fd.get('date'), dep: fd.get('dep') || '09:00', notes: g('notes'), carrier: g('carrier'), number: g('number'), seat: g('seat'), ref: g('ref'), cost: +fd.get('cost') || 0, extra: 0, book: '', miles: '', rental: false};
    if (cfg.fixedTimes) { o.arr = fd.get('arr') || o.dep; o.book = fd.get('book'); }
    else {
      const dur = getDur(fd) || 30; o.dur = dur; o.arr = hhmm(toMin(o.dep) + dur);
      if (m === 'car') { o.miles = +fd.get('miles') || ''; o.extra = +fd.get('extra') || 0; o.rental = !!fd.get('rental'); if (o.rental) o.book = fd.get('book'); else { o.cost = 0; o.carrier = ''; o.ref = ''; } }
    }
    if (isNew) S.legs.push(o); else S.legs[S.legs.findIndex(x => x.id === id)] = o;
    commit(); toast(isNew ? 'Travel added' : 'Saved');
  },
  (f, close) => {
    f.querySelector('#delBtn')?.addEventListener('click', () => { S.legs = S.legs.filter(x => x.id !== id); close(); commit(); toast('Deleted'); });
    f.querySelectorAll('[name=mode]').forEach(r => r.addEventListener('change', () => {

/* ---------- account sync: each trip is a private document in the viewer's own space ----------
   data/users/<viewer id>/trip-<id> holds one trip; data/users/<viewer id>/prefs remembers the open one.
   Nobody else who opens this page can read them, the page's owner included. */
const SYNC = {state: window.claude?.use ? 'connecting' : 'local', db:null, col:null, ready:false, trips:[], lastJson:{}, timer:null, chain:Promise.resolve(), firstTimer:null};

  const tip = SYNC.state === 'local' ? (window.claude ? 'Open this page signed in to Claude to keep trips on all your devices.' : 'Trips stay in this browser. Use Trip, then Back up trip data, to move them to another device.') : SYNC.state === 'synced' ? 'Open this page on any device where you are signed in to Claude.' : '';

}
const tripMeta = d => { const x = d.data() || {}; return {id: d.id.slice(5), name: x.name || 'Untitled trip', start: x.start, end: x.end, updatedAt: x.updatedAt || 0, state: x.state}; };
async function initSync() {
  if (!window.claude?.use) return;
  let db = null, user = null;
  try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch (e) {}
  claude.use('sample').then(x => { GEO.claude = x; }).catch(() => {});
  const id = user ? await user.id().catch(() => null) : null;
  if (!db || !id) { setSync('local'); if (!S) render(); return; }
  SYNC.db = db; SYNC.col = db.collection('data/users/' + id); setSync('loading'); if (!S) render();
  SYNC.firstTimer = setTimeout(() => { if (!SYNC.ready) { setSync('offline'); if (!S) render(); } }, 10000);

}
function onRemote(snap) {

    if (S && ids.has(S.id)) { const t = SYNC.trips.find(t => t.id === S.id); if (t.state === JSON.stringify(S)) SYNC.lastJson[S.id] = t.state; else if ((S.updatedAt || 0) > t.updatedAt) pushNow(); else applyRemote(t); }
    else if (!S && SYNC.trips.length) applyRemote(SYNC.trips.find(t => t.id === prefs.active) || SYNC.trips[0]);
    setSync('synced'); render(); return;
  }
  if (S && !snap.metadata.hasPendingWrites) {
    const t = SYNC.trips.find(t => t.id === S.id);
    if (t && t.state && t.state !== SYNC.lastJson[S.id] && t.state !== JSON.stringify(S)) { applyRemote(t); softRender(); toast('Updated from another device'); }

function applyRemote(t) {
  try { const d = JSON.parse(t.state); d.id = t.id; d.geo ||= {}; d.routes ||= {}; S = d; SYNC.lastJson[t.id] = t.state; ensureDays(); if (!days().includes(ui.day)) ui.day = days()[0]; SCACHE = {}; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} } catch (e) {}
}
function queueSync() { if (!SYNC.ready || !S) return; setSync('saving'); clearTimeout(SYNC.timer); SYNC.timer = setTimeout(pushNow, 900); }
function flushNow() { if (SYNC.timer) { clearTimeout(SYNC.timer); SYNC.timer = null; pushNow(); } }
function pushNow() {
  SYNC.timer = null; if (!SYNC.col || !S) return;
  const id = S.id, j = JSON.stringify(S), t = S.trip;

  SYNC.chain = SYNC.chain.then(async () => {
    try { await SYNC.col.doc('trip-' + id).set({kind:'trip', name:t.name, start:t.start, end:t.end, updatedAt:Date.now(), state:j}); SYNC.lastJson[id] = j; if (!SYNC.timer) setSync('synced'); }

}

}

function tripsForm() {

    <div class="mf"><button type="button" class="btn" data-act="new-trip">Start a new trip</button><div class="r"><button type="button" class="btn" data-close>Close</button></div></div>`, () => {},
  f => f.addEventListener('click', async e => {

    f.querySelector('#tripList').innerHTML = tripRows() || '<div class="tip">No trips saved yet.</div>'; render(); toast('Trip deleted');
  }));
}
initSync();

/* ---------- place autocomplete for any input with data-ac ---------- */
const pendingGeo = {};
const ac = {pop:null, input:null, res:[], i:-1, timer:null, seq:0};
function acClose() { ac.pop?.remove(); ac.pop = null; ac.input = null; ac.i = -1; }
function acPick(n) {
  const r = ac.res[n], inp = ac.input; if (!r || !inp) return;
  inp.value = r.label;
  if (r.lat != null) { const store = S ? (S.geo ||= {}) : pendingGeo; store[r.label] = {lat:r.lat, lon:r.lon, approx:!!r.approx}; }
  if (S?.routes) { const n = norm(r.label); Object.keys(S.routes).forEach(k => { if (!S.routes[k].manual && k.split(' > ').includes(n)) delete S.routes[k]; }); }
  acClose(); inp.dispatchEvent(new Event('change', {bubbles:true}));
}
function acShow(inp, res, q, note) {
  acClose();
  const askClaude = !GEO.live && GEO.claude && !GEO.claudeOff && q;
  if (!res.length && !askClaude) return;
  ac.input = inp; ac.res = res; ac.i = -1;
  const pop = document.createElement('div'); pop.className = 'ac-pop'; pop.setAttribute('role', 'listbox');
  pop.innerHTML = (note ? `<div class="ac-src" style="border:0;margin:0">${esc(note)}</div>` : '')
    + res.map((r, n) => `<button type="button" role="option" data-n="${n}" aria-selected="false"><b>${esc(r.label)}</b>${r.sub ? `<span>${esc(r.sub)}</span>` : ''}</button>`).join('')
    + (askClaude ? `<button type="button" class="ac-claude" data-claude="1"><b>Find “${esc(q)}” with Claude</b><span>Looks up the exact street address. Uses your Claude account.</span></button>` : '')
    + `<div class="ac-src">${GEO.live ? 'Places from Photon · © OpenStreetMap contributors' : (window.claude ? 'Live map search is blocked inside Claude, so these come from a built-in town list and Claude.' : 'Map search is unavailable right now, so these come from a built-in town list.')}</div>`;
  pop.addEventListener('mousedown', async e => {
    e.preventDefault();
    const b = e.target.closest('[data-n]'); if (b) return acPick(+b.dataset.n);
    if (e.target.closest('[data-claude]')) {
      const cb = pop.querySelector('[data-claude]'); cb.disabled = true; cb.querySelector('b').textContent = 'Looking up with Claude…';
      const found = await GEO.claudeFind(q);
      if (ac.input !== inp) return;
      if (found.length) acShow(inp, [...found, ...res.filter(r => !r.approx || /\d/.test(r.label))].slice(0, 7), '', 'Matches from Claude');
      else acShow(inp, res, '', GEO.claudeOff ? 'Claude lookups are turned off for this page.' : 'Claude found no match. Check the spelling or add the town and state.');
    }
  });
  inp.parentElement.appendChild(pop); ac.pop = pop; inp.setAttribute('aria-expanded', 'true');
}
function acKey(e) {
  if (!ac.pop || e.target !== ac.input) return false;
  const opts = [...ac.pop.querySelectorAll('[data-n]')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); ac.i = (ac.i + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length; opts.forEach((o, n) => o.setAttribute('aria-selected', String(n === ac.i))); opts[ac.i].scrollIntoView({block:'nearest'}); return true; }
  if (e.key === 'Enter' && ac.i >= 0) { e.preventDefault(); acPick(ac.i); return true; }
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); acClose(); return true; }
  return false;
}
document.addEventListener('input', e => {
  const inp = e.target; if (!inp.matches?.('[data-ac]')) return;
  clearTimeout(ac.timer); const q = inp.value.trim();
  if (q.length < 2) return acClose();
  ac.timer = setTimeout(async () => { const my = ++ac.seq; const res = await GEO.search(q); if (my === ac.seq && document.activeElement === inp) acShow(inp, res, q); }, 220);
});
document.addEventListener('focusout', e => { if (e.target === ac.input) setTimeout(() => { if (document.activeElement !== ac.input) acClose(); }, 120); });

/* keep sticky panels clear of the header, whatever height it wraps to */
const hdr = document.querySelector('header');
const setHdr = () => document.documentElement.style.setProperty('--hdr', hdr.offsetHeight + 'px');
try { new ResizeObserver(setHdr).observe(hdr); } catch (e) { window.addEventListener('resize', setHdr); }
setHdr();

render();
</script>

</body></html>
